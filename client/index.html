  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Load Umami analytics only when the VITE env vars are configured.
      const _ANALYTICS_ENDPOINT = import.meta.env.VITE_ANALYTICS_ENDPOINT || "";
      const _ANALYTICS_WEBSITE_ID =
        import.meta.env.VITE_ANALYTICS_WEBSITE_ID || "";
      if (_ANALYTICS_ENDPOINT && _ANALYTICS_WEBSITE_ID) {
        const endpoint = _ANALYTICS_ENDPOINT.replace(/\/$/, "");
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.setAttribute("data-website-id", _ANALYTICS_WEBSITE_ID);
        document.head.appendChild(s);
      }
    </script>
  </body>
